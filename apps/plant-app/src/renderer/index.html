<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RMC Plant App (Offline)</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b1220; color: #e6ecf6; margin: 0; padding: 22px; }
    h1 { font-size: 20px; }
    .card { background: #111a2e; border: 1px solid #26314b; border-radius: 10px; padding: 16px; margin-bottom: 14px; }
    input, button { padding: 8px 10px; border-radius: 7px; border: 1px solid #26314b; background: #0e1626; color: #e6ecf6; margin: 3px; }
    button { background: #f4b740; color: #1a1205; font-weight: 600; cursor: pointer; }
    .muted { color: #8aa0c6; font-size: 12px; }
    pre { background: #0e1626; padding: 10px; border-radius: 7px; overflow: auto; font-size: 12px; }
  </style>
</head>
<body>
  <h1>🏗️ RMC Plant App <span class="muted">(offline-first)</span></h1>

  <div class="card">
    <div><b>Connect</b></div>
    <input id="baseUrl" value="http://localhost:4000" size="30" />
    <input id="token" placeholder="access token" size="40" />
    <button onclick="doAuth()">Set auth</button>
    <button onclick="doRegister()">Register + bootstrap</button>
  </div>

  <div class="card">
    <div><b>Offline entry</b> <span class="muted">(works without network)</span></div>
    <button onclick="reserve()">Reserve 50 challan numbers</button>
    <button onclick="newChallan()">New offline challan</button>
    <button onclick="newBatch()">New offline batch</button>
  </div>

  <div class="card">
    <div><b>Sync</b></div>
    <button onclick="doPush()">Push</button>
    <button onclick="doPull()">Pull</button>
    <button onclick="refresh()">Status</button>
  </div>

  <div class="card"><b>Log</b><pre id="log"></pre></div>

  <script>
    const log = (x) => { document.getElementById('log').textContent = JSON.stringify(x, null, 2) + '\n' + document.getElementById('log').textContent; };
    async function doAuth() { log(await window.rmc.auth(document.getElementById('baseUrl').value, document.getElementById('token').value)); }
    async function doRegister() { log(await window.rmc.register({ deviceIdentifier: 'PLANT-DEV-1', deviceName: 'Plant PC 1' })); }
    async function reserve() { log(await window.rmc.reserve('delivery_challan', 50)); }
    async function newChallan() { log(await window.rmc.createChallan({ gradeLabel: 'M25', quantityM3: 6, slump: '120mm', receiverName: 'Site Eng' })); }
    async function newBatch() { log(await window.rmc.createBatch({ gradeLabel: 'M25', batchQuantityM3: 6 })); }
    async function doPush() { log(await window.rmc.push()); }
    async function doPull() { log(await window.rmc.pull()); }
    async function refresh() { log(await window.rmc.status()); }
  </script>
</body>
</html>
