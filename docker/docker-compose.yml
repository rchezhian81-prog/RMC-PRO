services:
  postgres:
    image: postgres:16-alpine
    container_name: rmc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rmc}
      POSTGRES_USER: ${POSTGRES_USER:-rmc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rmc}
    ports:
      - '5432:5432'
    volumes:
      - rmc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rmc}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rmc-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - rmc_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: rmc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - rmc_miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rmc_pgdata:
  rmc_redisdata:
  rmc_miniodata:
