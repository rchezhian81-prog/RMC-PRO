# RMC Plant SaaS — Nginx reverse-proxy TEMPLATE (Phase-1 pilot, Option A).
#
# TEMPLATE ONLY — not deployed by this repo. Before use, replace the literal
# token <DOMAIN> with your real registered domain, e.g.:
#   sed -i 's/<DOMAIN>/rmc.example.in/g' docker/nginx/rmc.conf
# and issue TLS certs on the host (see the runbook). Do NOT start nginx while
# <DOMAIN> is still a placeholder.
#
# Hosts (Option A):
#   app.<DOMAIN>    -> web:3000   (Next.js portal: tenant + super-admin)
#   rmc.<DOMAIN>    -> api:4000   (NestJS API: /api/v1, /health)
#   pilot.<DOMAIN>  -> 301 redirect to https://app.<DOMAIN>

# WebSocket upgrade helper (future-proofing; harmless for plain HTTP).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- HTTP :80 — ACME challenge + redirect everything else to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name app.<DOMAIN> rmc.<DOMAIN> pilot.<DOMAIN>;

    # Let's Encrypt webroot challenge (certbot writes here on the host).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Shared TLS + hardening (included by each HTTPS server) ----
# Cert paths assume a single SAN cert covering all three hosts under
# /etc/letsencrypt/live/<DOMAIN>/ — adjust if you issue per-host certs.

# ---- app.<DOMAIN> : web portal ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.<DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers. Enable HSTS only AFTER HTTPS is verified working.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }
}

# ---- rmc.<DOMAIN> : API ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rmc.<DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Invoice/challan PDFs and CSV exports — allow a generous body/response.
    client_max_body_size 25m;

    location / {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

# ---- pilot.<DOMAIN> : redirect to the web portal ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pilot.<DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://app.<DOMAIN>$request_uri;
}
